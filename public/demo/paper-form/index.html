<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Paper submission · demo form</title>
<style>
  :root { --ink: #1f2933; --muted: #5f6b7a; --line: #d9e2ec; --bg: #f4f6f9; --accent: #1d4ed8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 28px; display: flex; align-items: center; gap: 14px; }
  header .name { font-weight: 700; }
  header .demo { margin-left: auto; font-size: 12px; color: #7a4b00; background: #fff6e0; border: 1px solid #f2d18b; border-radius: 999px; padding: 3px 12px; }
  main { max-width: 1060px; margin: 0 auto; padding: 22px 28px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 18px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px 18px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
  input, select { width: 100%; padding: 7px 10px; font: inherit; color: var(--ink); background: #fff; border: 1px solid #bcc8d6; border-radius: 6px; }
  input:focus, select:focus { outline: 2px solid #93c5fd; outline-offset: 0; border-color: var(--accent); }
  .paper { display: grid; grid-template-columns: 3fr 1fr; gap: 12px; }
  .authors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 12px; margin: 0; }
  legend { font-size: 13px; font-weight: 600; padding: 0 4px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .actions .note { margin-right: auto; color: var(--muted); font-size: 13px; }
  button { font: inherit; padding: 9px 18px; border-radius: 6px; border: 1px solid #bcc8d6; background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #result { display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; background: #e8f5e9; border: 1px solid #a5d6a7; }
</style>
</head>
<body>
<header>
  <span class="name">Paper submission</span>
  <span class="demo">Demo form for trying Browy. Nothing is sent anywhere.</span>
</header>
<main>
  <h1>Submit a paper</h1>
  <p class="lede">List every author in order, with the affiliation shown on the paper.</p>
  <div id="result" role="status"></div>
  <form id="submission" autocomplete="off">
    <section>
      <h2>Paper</h2>
      <div class="paper">
        <div><label for="title">Title</label><input id="title" name="title" required></div>
        <div><label for="track">Track</label>
          <select id="track" name="track" required>
            <option value="">Choose a track</option>
            <option>Machine learning</option>
            <option>Natural language processing</option>
            <option>Computer vision</option>
            <option>Systems</option>
            <option>Human-computer interaction</option>
          </select>
        </div>
      </div>
    </section>
    <section>
      <h2>Authors, in order</h2>
      <div class="authors" id="authors"></div>
    </section>
    <div class="actions">
      <span class="note">You can edit everything after saving a draft.</span>
      <button type="button" id="draft">Save draft</button>
      <button type="submit" class="primary">Submit paper</button>
    </div>
  </form>
</main>
<script>
  const box = document.getElementById('authors');
  for (let i = 1; i <= 8; i++) {
    const f = document.createElement('fieldset');
    f.innerHTML = `<legend>Author ${i}</legend>
      <div class="pair">
        <div><label for="a${i}-first">First name</label><input id="a${i}-first" name="author${i}_first"></div>
        <div><label for="a${i}-last">Last name</label><input id="a${i}-last" name="author${i}_last"></div>
      </div>
      <label for="a${i}-aff">Affiliation</label><input id="a${i}-aff" name="author${i}_affiliation">`;
    box.appendChild(f);
  }
  const result = document.getElementById('result');
  const say = (text) => { result.textContent = text; result.style.display = 'block'; result.scrollIntoView({ block: 'center' }); };
  document.getElementById('submission').addEventListener('submit', (e) => {
    e.preventDefault();
    say('Submitted. This is a demo, so nothing was sent.');
  });
  document.getElementById('draft').addEventListener('click', () => say('Draft saved in this tab only. This is a demo.'));
</script>
</body>
</html>
